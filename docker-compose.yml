services:
  postgres:
    image: postgres:17
    container_name: payment_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_processing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_processing"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: payment_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: payment_api
    command: >
      sh -c "
        uv run --no-dev alembic upgrade head &&
        uv run --no-dev python bin/run_api.py
      "
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_CONNECTION_STRING: postgresql+asyncpg://postgres:postgres@postgres:5432/payment_processing
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build: .
    container_name: payment_consumer
    command: sh -c "uv run --no-dev alembic upgrade head && uv run --no-dev python bin/run_consumer.py"
    env_file:
      - .env
    environment:
      POSTGRES_CONNECTION_STRING: postgresql+asyncpg://postgres:postgres@postgres:5432/payment_processing
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
