[project]
name = "paymentprocessing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pika>=1.4.4",
    "pre-commit>=4.7.0",
    "pydantic-settings>=2.16.2",
    "pydantic[standard]>=2.14.2",
    "ruff>=0.17.3",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
paymentprocessing = "paymentprocessing:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "__pycache__", ".idea", ".git"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
