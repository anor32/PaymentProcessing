[project]
name = "paymentprocessing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "faststream[rabbit]>=0.3.0",
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pydantic-settings>=2.16.2",
    "pydantic>=2.14.2",
    "ruff>=0.17.3",
    "sqlalchemy[asyncio]>=2.1.8",
]
[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "mypy>=1.11.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "aiosqlite>=0.22.1",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "alembic.*",
    "fastapi.*",
    "faststream.*",
    "pydantic.*",
    "pydantic_settings.*",
    "asyncpg.*",
    "httpx.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "__pycache__", ".idea", ".git"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
